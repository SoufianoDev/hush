name: Hush CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-bundle:
    name: Validate manifests and build web packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate all host manifests and entrypoints
        run: npm run validate

      - name: Build Claude and ChatGPT upload packages
        run: npm run bundle

      - name: Verify generated archives
        run: |
          unzip -t dist/hush-claude-plugin.zip
          unzip -t dist/hush-openai-plugin.zip

  opencode-v2-install:
    name: Install Hush through OpenCode V2
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode V2
        run: npm install --global @opencode/cli

      - name: Confirm OpenCode V2 is installed
        run: |
          version="$(opencode --version)"
          echo "Installed OpenCode version: $version"
          version="${version#opencode v}"
          case "$version" in
            2.*) ;;
            *)
              echo "Expected OpenCode V2, got: $version" >&2
              exit 1
              ;;
          esac

      - name: Install Hush from the tested Git branch
        env:
          PLUGIN_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PLUGIN_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          opencode plugin add "github:${PLUGIN_REPOSITORY}#${PLUGIN_REF}"
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const configPath = path.join(process.env.HOME, ".config/opencode/opencode.json")
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"))
          const expected = `github:${process.env.PLUGIN_REPOSITORY}#${process.env.PLUGIN_REF}`
          if (!JSON.stringify(config.plugins ?? []).includes(expected)) {
            throw new Error(`OpenCode did not persist the Hush plugin specifier: ${expected}`)
          }
          console.log(`OpenCode persisted the Hush Git plugin: ${expected}`)
          NODE

      - name: Verify Hush is registered as a native skill
        run: |
          opencode serve --hostname 127.0.0.1 --port 4096 > "$RUNNER_TEMP/opencode-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4096/global/health" >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/opencode-server.log"
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 30); do
            if curl -fsSG --data-urlencode "directory=$GITHUB_WORKSPACE" \
              "http://127.0.0.1:4096/api/skill" -o "$RUNNER_TEMP/skills.json"; then
              if node -e '
                const payload = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
                const skill = payload.data?.find((entry) => entry.id === "hush")
                if (!skill || !skill.description || !skill.content.includes("Cleanup pass")) process.exit(1)
              ' "$RUNNER_TEMP/skills.json"; then
                echo "OpenCode registered the Hush skill with its full instructions."
                exit 0
              fi
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/opencode-server.log"
          cat "$RUNNER_TEMP/skills.json" 2>/dev/null || true
          echo "OpenCode did not expose the Hush native skill."
          exit 1
